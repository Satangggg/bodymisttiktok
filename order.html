<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อน้ำหอมฉีดตัวและโรลออน Body Scent">
  <link rel="stylesheet" href="style.css">
  <style>
    .order-wrap {
      max-width: 36rem;
      margin-inline: auto;
      padding: var(--space-4) var(--space-4) var(--space-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--ivory);
    }
    .order-wrap .field:last-of-type { margin-bottom: var(--space-4); }
    .order-wrap textarea { resize: vertical; min-height: 5rem; }
    .order-actions { display: flex; flex-direction: column; gap: var(--space-2); }
    .order-actions .btn { width: 100%; }
    .order-actions .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .order-back { text-align: center; font-size: 0.9rem; }
    .order-hint { margin: 0 0 var(--space-3); font-size: 0.85rem; color: var(--ink-faint); }
    @media (max-width: 640px) {
      .order-wrap { padding: var(--space-3) var(--space-3) var(--space-2); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section class="page-title">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <p class="lead">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันการสั่งซื้อและแจ้งรายละเอียดการชำระเงิน</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="orderForm" class="order-wrap">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ (ไม่บังคับ)</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div class="order-actions">
            <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
            <p class="order-back mb-0"><a class="link-line" href="product.html">กลับไปเลือกสินค้า</a></p>
          </div>

        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 Body Scent</span>
      <ul class="footer-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
