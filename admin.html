<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ — Body Scent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--ivory);
    }
    .orders-table {
      width: 100%;
      min-width: 52rem;
      border-collapse: collapse;
      font-size: 0.9rem;
      line-height: 1.7;
    }
    .orders-table th,
    .orders-table td {
      padding: 0.9rem 1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }
    .orders-table thead th {
      position: sticky;
      top: 0;
      background: var(--cream);
      border-bottom: 1px solid var(--line);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: var(--ink-soft);
    }
    .orders-table tbody tr:last-child td { border-bottom: 0; }
    .orders-table tbody tr:hover td { background: rgba(244, 238, 226, 0.5); }
    .orders-table td:nth-child(1) { white-space: nowrap; color: var(--ink-faint); }
    .orders-table td:nth-child(5) {
      text-align: right;
      white-space: nowrap;
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--bronze-deep);
    }
    .orders-table th:nth-child(5) { text-align: right; }
    .orders-table td.text-center { text-align: center; padding-block: var(--space-4); color: var(--ink-faint); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section class="page-title">
      <div class="container">
        <h1>รายการสั่งซื้อ</h1>
        <p class="lead">ออเดอร์ทั้งหมดจาก Google Sheet เรียงจากล่าสุดขึ้นก่อน</p>
      </div>
    </section>

    <section class="section products-section">
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable" class="orders-table">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 Body Scent</span>
      <ul class="footer-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
